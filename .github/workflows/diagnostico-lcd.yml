name: Diagnosticar LCD ESP32

on:
  push:
    branches: [diagnostico/lcd-v031]
  workflow_dispatch:
  pull_request:

jobs:
  lcd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [diag_st7789, diag_ili9341]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Compilar LCD
        run: pio run -e '${{ matrix.environment }}'
      - name: Preparar firmware de teste
        shell: bash
        run: |
          set -euo pipefail
          cp '.pio/build/${{ matrix.environment }}/firmware.bin' 'RJP-LCD-${{ matrix.environment }}-app.bin'
          sha256sum RJP-LCD-${{ matrix.environment }}-app.bin > 'SHA256-${{ matrix.environment }}.txt'
      - name: Anexar binarios
        uses: actions/upload-artifact@v4
        with:
          name: RJP-LCD-${{ matrix.environment }}
          path: |
            RJP-LCD-${{ matrix.environment }}-app.bin
            SHA256-${{ matrix.environment }}.txt
          if-no-files-found: error
