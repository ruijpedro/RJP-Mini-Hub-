name: Compilar firmware ESP32

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [cyd_ili9341, cyd_st7789]
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar compilador
        run: python -m pip install 'platformio==6.1.18' 'esptool==4.9.0'
      - name: Compilar
        run: pio run -e '${{ matrix.environment }}'
      - name: Gerar imagem completa 0x0
        shell: bash
        run: |
          set -euo pipefail
          DIR='.pio/build/${{ matrix.environment }}'
          APP_BOOT="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          EXTRA=()
          if [[ -f "$APP_BOOT" ]]; then EXTRA=(0xe000 "$APP_BOOT"); fi
          python -m esptool --chip esp32 merge_bin --output 'RJP-MiniHub-${{ matrix.environment }}-full.bin' --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 "$DIR/bootloader.bin" 0x8000 "$DIR/partitions.bin" "${EXTRA[@]}" 0x10000 "$DIR/firmware.bin"
          cp "$DIR/firmware.bin" 'RJP-MiniHub-${{ matrix.environment }}-app.bin'
          sha256sum RJP-MiniHub-${{ matrix.environment }}-*.bin > 'SHA256-${{ matrix.environment }}.txt'
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: RJP-MiniHub-${{ matrix.environment }}
          path: |
            RJP-MiniHub-${{ matrix.environment }}-*.bin
            SHA256-${{ matrix.environment }}.txt
          if-no-files-found: error
