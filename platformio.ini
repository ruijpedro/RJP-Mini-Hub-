[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -D USER_SETUP_LOADED=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D USE_HSPI_PORT
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000

[env:cyd_ili9341]
extends = env
build_flags =
  ${env.build_flags}
  -D ILI9341_2_DRIVER=1
  -D TFT_RGB_ORDER=TFT_BGR

[env:cyd_st7789]
extends = env
build_flags =
  ${env.build_flags}
  -D ST7789_DRIVER=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF=1


; Diagnostico LCD independente, nao alterar a compilacao normal.
[env:diag_st7789]
extends = env:cyd_st7789
build_src_filter = +<display_diag.cpp> -<main.cpp>
build_flags =
  ${env:cyd_st7789.build_flags}
  -D DISPLAY_DIAGNOSTIC=1

[env:diag_ili9341]
extends = env:cyd_ili9341
build_src_filter = +<display_diag.cpp> -<main.cpp>
build_flags =
  ${env:cyd_ili9341.build_flags}
  -D DISPLAY_DIAGNOSTIC=1
